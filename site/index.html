<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spot Fiducial AprilTag Plate Generator</title>
    <meta
      name="description"
      content="Generate fabrication-ready Spot fiducial SVG plates with AprilTag, fitted text, and validated drill presets."
    />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./vendor/opentype.js"></script>
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <main class="layout">
        <section class="preview-panel" aria-labelledby="page-title">
          <header class="preview-header">
            <div class="title-block">
              <h1 id="page-title">Spot Fiducial plate generator</h1>
              <p class="section-copy">Live preview, validated inputs, clean SVG export.</p>
            </div>

            <div class="status-chip" id="status-chip" role="status" aria-live="polite" aria-atomic="true">
              Loading assets
            </div>
          </header>

          <div class="preview-frame">
            <div class="preview-svg-wrap" id="preview-root"></div>
          </div>
        </section>

        <aside class="control-panel">
          <form id="generator-form" class="control-form" novalidate>
            <section class="panel-card control-card">
              <section class="panel-section">
                <h2>Plate</h2>

                <div class="field-grid">
                  <label class="field field-half">
                    <span class="field-label">Company name</span>
                    <input
                      id="company-name"
                      name="companyName"
                      type="text"
                      maxlength="28"
                      placeholder="Company"
                      aria-describedby="company-name-message"
                    />
                    <small class="field-message" id="company-name-message"></small>
                  </label>

                  <label class="field field-half">
                    <span class="field-label">Robot name</span>
                    <input
                      id="robot-name"
                      name="robotName"
                      type="text"
                      maxlength="28"
                      placeholder="Spot"
                      aria-describedby="robot-name-message"
                    />
                    <small class="field-message" id="robot-name-message"></small>
                  </label>

                  <label class="field field-third">
                    <span class="field-label">AprilTag ID</span>
                    <select id="tag-id" name="tagId" aria-describedby="tag-id-message"></select>
                    <small class="field-message" id="tag-id-message"></small>
                  </label>

                  <label class="field field-third">
                    <span class="field-label">Font family</span>
                    <select id="font-family" name="fontFamily" aria-describedby="font-family-message"></select>
                    <small class="field-message" id="font-family-message"></small>
                  </label>

                  <label class="field field-third">
                    <span class="field-label">Drill-hole preset</span>
                    <select id="drill-preset" name="drillPreset" aria-describedby="drill-preset-message"></select>
                    <small class="field-message" id="drill-preset-message"></small>
                  </label>
                </div>
              </section>

              <section class="panel-section panel-section-bordered">
                <h2>Logo</h2>

                <div class="field radio-group" id="logo-mode-field">
                  <span class="field-label">Source</span>
                  <div class="radio-stack">
                    <label class="radio-option">
                      <input type="radio" name="logoMode" value="default" checked />
                      <span class="radio-text">Default</span>
                    </label>
                    <label class="radio-option">
                      <input type="radio" name="logoMode" value="custom" />
                      <span class="radio-text">Custom</span>
                    </label>
                    <label class="radio-option">
                      <input type="radio" name="logoMode" value="empty" />
                      <span class="radio-text">Empty</span>
                    </label>
                  </div>
                </div>

                <label class="field field-full" id="logo-upload-field" hidden>
                  <span class="field-label">Custom SVG</span>
                  <input
                    id="logo-upload"
                    name="logoUpload"
                    type="file"
                    accept=".svg,image/svg+xml"
                    aria-describedby="logo-upload-message"
                  />
                  <small class="field-message" id="logo-upload-message"></small>
                </label>

                <button class="ghost-button" id="clear-logo-upload" type="button" hidden>Clear uploaded logo</button>
              </section>
            </section>

            <section class="panel-card export-card">
              <h2>Export</h2>
              <div class="banner" id="global-message" role="status" aria-live="polite" aria-atomic="true"></div>
              <button class="primary-button" id="export-button" type="button" aria-describedby="global-message">
                Download SVG
              </button>
            </section>
          </form>
        </aside>
      </main>
    </div>
  </body>
</html>
